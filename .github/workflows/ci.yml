name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seasons
          POSTGRES_PASSWORD: seasons
          POSTGRES_DB: seasons
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seasons"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build without any environment variables (as a fresh fork does)
        run: npm run build
      - name: Database setup, demo season and setup check
        env:
          DATABASE_URL: postgres://seasons:seasons@localhost:5432/seasons
          SITE_URL: http://localhost:3000
          SETUP_TOKEN: ci-only-setup-token-0123456789
          STORAGE_DRIVER: local
        run: |
          npm run db:migrate
          npm run seed
          npm run seed   # a second run must leave the demo season alone
          npm run doctor

  # Browser tests: the real editor and reader driven with mouse, keys and scrolling (e2e/).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
